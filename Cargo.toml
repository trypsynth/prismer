[workspace]
resolver = "3"
members = ["crates/prism-sys", "crates/prismer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/trypsynth/prismer"
keywords = ["tts", "speech", "accessibility", "screen-reader"]
categories = ["accessibility", "api-bindings"]

[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
ffi_unwind_calls = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Conflicts with the rustc unreachable_pub lint, which matters more on a
# public library: it stops private items from leaking into the API surface.
redundant_pub_crate = "allow"
undocumented_unsafe_blocks = "deny"
