[workspace]
resolver = "3"
members = ["crates/prism-sys", "crates/prismer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/trypsynth/prismer"
keywords = ["tts", "speech", "accessibility", "screen-reader"]
categories = ["accessibility", "api-bindings"]

[workspace.lints.rust]
elided_lifetimes_in_paths = "forbid"
explicit_outlives_requirements = "forbid"
ffi_unwind_calls = "forbid"
let_underscore_drop = "forbid"
missing_debug_implementations = "forbid"
missing_docs = "forbid"
non_ascii_idents = "forbid"
redundant_lifetimes = "forbid"
single_use_lifetimes = "forbid"
trivial_casts = "forbid"
trivial_numeric_casts = "forbid"
unreachable_pub = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_import_braces = "forbid"
unused_lifetimes = "forbid"
unused_qualifications = "forbid"
unused_results = "forbid"

[workspace.lints.clippy]
all = { level = "forbid", priority = -1 }
pedantic = { level = "forbid", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Conflicts with the rustc unreachable_pub lint, which matters more on a
# public library: it stops private items from leaking into the API surface.
redundant_pub_crate = "allow"
undocumented_unsafe_blocks = "forbid"
